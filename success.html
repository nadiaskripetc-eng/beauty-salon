<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дякуємо за запис — LUMI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f3ee;
      color: #292522;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .success {
      width: min(90%, 620px);
      padding: 70px 30px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 32px;
      letter-spacing: 8px;
      margin-bottom: 55px;
    }

    .success h1 {
      font-family: Georgia, serif;
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 400;
      line-height: 1;
      margin: 0 0 25px;
    }

    .success p {
      font-size: 18px;
      line-height: 1.7;
      color: #766d66;
      margin: 0 auto 40px;
      max-width: 480px;
    }

    .button {
      display: inline-block;
      padding: 16px 32px;
      background: #292522;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 16px;
    }

    .button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <main class="success">
    <div class="logo">LUMI</div>

    <h1>Дякуємо ✨</h1>

    <p>
      Вашу заявку успішно отримано.<br>
      Ми зв'яжемося з вами найближчим часом,
      щоб підтвердити дату та час.
    </p>

    <a href="/" class="button">Повернутися на головну</a>
  </main>

</body>
</html>
